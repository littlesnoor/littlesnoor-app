<style>
:root{--sage:#3E5B4A;--sagel:#E8F1E2;--cream:#FFF9F3;--ink:#3A3238;--muted:#857882;--line:#E6DAD0;--ter:#9C5238;--pc:#7FBF95;--pl:#E2F2E7;--pd:#3B8456}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);}
body{--bg:#FFF9F3;--gl:rgba(62,91,74,.06);
background-color:var(--bg);
background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);
background-size:28px 28px,28px 28px;background-attachment:fixed;transition:background-color .4s;color:var(--ink);font-family:Poppins,system-ui,-apple-system,sans-serif}
body{padding-bottom:0}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}
h1,h2,h3{margin:0}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand b{color:var(--sage);font-size:15px;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--muted)}
.hello{font-size:26px;font-weight:700;line-height:1.25}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 22px rgba(62,91,74,.08);margin-top:16px}
.hero{display:flex;gap:18px;align-items:center;background:var(--sage);color:#fff}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:24px;line-height:1}
.ring small{font-size:11px;font-weight:500;opacity:.8;margin-top:4px}
.hero h3{font-size:18px}
.hero p{margin:6px 0 0;font-size:13px;opacity:.85}
.streak{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-size:12px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font:600 15px Poppins,system-ui;cursor:pointer;background:var(--sage);color:#fff}
.btn.light{background:var(--sagel);color:var(--sage)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.today .k{font-size:12px;font-weight:600;color:var(--pd);text-transform:uppercase;letter-spacing:.6px}
.today h3{font-size:20px;margin:4px 0 10px}
.qsmall{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 14px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.part{border-radius:18px;padding:14px;cursor:pointer}
.part b{display:block;font-size:14px}
.part span{font-size:12px;opacity:.75}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.7);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
/* day */
.dayhead{border-radius:0 0 28px 28px;margin:calc(-18px - env(safe-area-inset-top)) -20px 0;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;background:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px) 0 0/28px 28px,var(--pl)}
.dayhead .daytitle{color:var(--pd)}
.topnav{display:flex;justify-content:space-between;align-items:center}
.icon{width:40px;height:40px;border-radius:14px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:18px}
.icon:disabled{opacity:.35}
.chip{display:inline-block;background:var(--pc);color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:5px 12px}
.daytitle{font-size:26px;font-weight:700;margin:14px 0 4px;line-height:1.25}
.quote{background:rgba(255,255,255,.92);border-radius:18px;padding:14px 16px;margin-top:14px;font-size:13.5px;font-style:italic;color:var(--ink);border-left:4px solid var(--pc)}
.quote small{display:block;font-style:normal;color:var(--muted);font-size:11.5px;margin-top:6px}
.blk{margin-top:22px}
.blk label{display:block;font-weight:600;font-size:15px;margin-bottom:8px;line-height:1.4}
.dayview .blk:not(:first-child){}
.blk.box{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font:15px Poppins,system-ui;color:var(--ink);background:#fff;resize:none;outline:none;line-height:1.6}
textarea:focus,input:focus{border-color:var(--pc)}
textarea.letter{min-height:260px;background:repeating-linear-gradient(#fff,#fff 31px,var(--line) 32px);line-height:32px;padding-top:4px}
.li{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.li em{width:28px;height:28px;flex:none;border-radius:50%;background:var(--pl);color:var(--pd);font-style:normal;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:8px}
.dot{flex:1;aspect-ratio:1;border-radius:50%;border:2px solid var(--pc);background:#fff;cursor:pointer;font-size:11px;color:var(--muted);font-family:Poppins}
.dot.on{background:var(--pc);color:#fff}
.moods{display:flex;gap:8px}
.mood{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 0;font-size:22px;cursor:pointer}
.mood.on{border-color:var(--pc);background:var(--pl)}
.mood small{display:block;font-size:10px;color:var(--muted);font-family:Poppins}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--sagel);border-radius:18px;padding:16px;cursor:pointer}
.check{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--sage);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.step.on .check{background:var(--sage)}
.step b{font-size:12px;color:var(--sage);text-transform:uppercase;letter-spacing:.6px}
.step p{margin:3px 0 0;font-size:14px}
.saved{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px;min-height:16px}
/* journey */
.sec{margin-top:22px}
.sec h3{font-size:16px}
.sec p{margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border-radius:16px;padding:10px;min-height:76px;background:#fff;border:1.5px solid var(--line);cursor:pointer;text-align:left;font-family:Poppins;color:var(--ink)}
.tile b{font-size:18px;display:block}
.tile span{font-size:10.5px;line-height:1.25;display:block;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.done{color:#fff;border-color:transparent}
.tile.done span{color:rgba(255,255,255,.85)}
.tile.cur{box-shadow:0 0 0 3px var(--ter)}
/* nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(62,91,74,.12);display:flex;justify-content:center;padding:8px 0;z-index:5}
nav button{flex:1;max-width:140px;border:0;background:none;font:500 11px Poppins,system-ui;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--sage);font-weight:600}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(40,34,44,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--cream);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--sage);color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:500;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:opacity .3s}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.arch{width:150px;height:180px;margin:0 auto 22px;border:6px solid var(--ter);border-radius:75px 75px 12px 12px;background:#FCEFE6;position:relative;overflow:hidden}
.arch:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#F2B48A;left:24px;bottom:30px}
.arch:after{content:"";position:absolute;left:-10px;right:-10px;bottom:-30px;height:70px;border-radius:50%;background:#BFE0C9}
.big{font-size:34px;font-weight:700;color:var(--ter)}
.row{display:flex;gap:10px}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.prod{background:#fff;border-radius:22px;padding:12px;box-shadow:0 6px 22px rgba(62,91,74,.08);cursor:pointer;position:relative;text-align:left;border:0;font-family:Poppins,system-ui;color:var(--ink)}
.prod img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.prod b{display:block;font-size:14.5px;margin-top:10px;line-height:1.3}
.prod span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.tag{position:absolute;top:20px;left:20px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px;font-weight:600;border-radius:99px;padding:4px 10px;background:#fff;color:var(--ink)}
.prod.locked img{filter:grayscale(.45) brightness(1.05);opacity:.75}
.confetti{font-size:46px;text-align:center;margin-top:6px}
.cert{width:100%;border-radius:18px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.then{background:var(--sagel);border-radius:18px;padding:14px 16px;font-style:italic;font-size:14px;line-height:1.6;color:var(--ink)}
.stat3{display:flex;gap:10px;margin-top:12px}.stat3 div{flex:1;background:#fff;border-radius:16px;padding:12px;text-align:center}.stat3 b{display:block;font-size:22px;color:var(--sage)}.stat3 span{font-size:11.5px;color:var(--muted)}
.gentle{background:#FCE4E8;border-radius:22px;padding:16px;margin-top:16px;font-size:14px;line-height:1.6;color:#7A3B4A}
.lockcard{background:#fff;border:2px dashed var(--line);border-radius:22px;padding:22px;text-align:center}
.lockcard b{display:block;font-size:17px;margin-top:6px}
.mjcard{background:#fff;border-radius:20px;padding:14px 16px;margin-top:12px;box-shadow:0 4px 16px rgba(74,54,85,.07);cursor:pointer;border-left:5px solid var(--pc);text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0;font-family:Poppins,system-ui;color:var(--ink);display:block}
.mjcard b{display:block;font-size:15px;line-height:1.35}.mjcard span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mtile{border:0;border-radius:18px;padding:14px;text-align:left;font-family:Poppins,system-ui;cursor:pointer;min-height:84px}
.mtile b{display:block;font-size:14px}.mtile span{font-size:11.5px;opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.fchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:500 12.5px Poppins,system-ui;color:var(--ink);cursor:pointer}
.fchip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.amal{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F1EAE4;cursor:pointer}
.amal .check{border-color:var(--sage)}.amal.on .check{background:var(--sage)}
.amal span{flex:1;font-size:14.5px}
.pbar{height:8px;border-radius:9px;background:#F1EAE4;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:var(--pc);border-radius:9px}
.lrow{background:#fff;border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.lrow input,.lrow textarea{margin-top:6px}
.pdots{display:flex;gap:6px;margin-top:8px}.pdots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--pc);background:#fff;cursor:pointer;padding:0}.pdots button.on{background:var(--pc)}
.mini{border:0;background:none;color:var(--muted);font:500 12px Poppins,system-ui;cursor:pointer;padding:4px}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;font:500 13px Poppins,system-ui;cursor:pointer;color:var(--ink)}.seg button.on{background:var(--pl);border-color:var(--pc);color:var(--pd)}
input[type=date]{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;font:15px Poppins,system-ui;color:var(--ink);background:#fff}
.tb{display:flex;gap:6px;margin:-2px 0 6px}.tb button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font:600 13px Poppins,system-ui;color:var(--pd);cursor:pointer}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px Poppins,system-ui;color:var(--sage);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)}
#print{display:none}
@media print{
 body{background:#fff!important;padding:0!important}
 #app,#nav,.toast,.modal{display:none!important}
 #print{display:block;font-family:Poppins,system-ui,sans-serif;color:#3A3238}
 .pp{page-break-after:always;padding:6mm 4mm}.pp:last-child{page-break-after:auto}
 .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #5B4370;padding-bottom:6px;margin-bottom:14px}
 .ph b{font-size:11pt;color:#5B4370}.ph span{font-size:9pt;color:#857882}
 .pt{font-size:18pt;font-weight:700;margin:0 0 4px}.pm{font-size:10pt;color:#857882;margin-bottom:14px}
 .pf{margin-bottom:12px;break-inside:avoid}.pf h4{margin:0 0 4px;font-size:10.5pt;color:#5B4370}
 .pf div{font-size:10.5pt;line-height:1.6;white-space:pre-wrap;border-left:3px solid #E3D9F3;padding-left:10px;min-height:14pt}
 .pchk{font-size:10.5pt;line-height:1.8}
 .pfoot{margin-top:18px;font-size:8.5pt;color:#9a8f98;text-align:center}
 @page{size:A4;margin:14mm}
}
.ibg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ib{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;font:500 13px Poppins,system-ui;color:var(--ink);cursor:pointer;text-align:left}
.ib .check{width:22px;height:22px;border-radius:7px;font-size:12px}
.ib.on{border-color:var(--pc);background:var(--pl)}.ib.on .check{background:var(--sage)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}.ch.we{color:var(--pd)}
.cd{position:relative;min-height:56px;border:1px solid #F1EAE4;background:#fff;border-radius:10px;padding:4px 3px;font-family:Poppins,system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;color:var(--ink)}
.cd.e{border:0;background:transparent;cursor:default}
.cd b{font-size:13px;font-weight:600}.cd small{font-size:8.5px;color:var(--muted);line-height:1.2}
.cd i{font-style:normal;font-size:7.5px;line-height:1.15;background:var(--pl);color:var(--pd);border-radius:4px;padding:1px 2px;margin-top:2px;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left}
.cd u{position:absolute;top:6px;right:5px;width:6px;height:6px;border-radius:9px;background:var(--pc)}
.cd.td{border:2px solid var(--sage)}
.hgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}
.hd{aspect-ratio:1;border:1.5px solid var(--pc);background:#fff;border-radius:99px;font:500 11px Poppins,system-ui;color:var(--muted);cursor:pointer;padding:0}
.hd.on{background:var(--sage);border-color:var(--sage);color:#fff}.hd.td{box-shadow:0 0 0 2px var(--pl)}
.jgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.juz{aspect-ratio:1;border:2px solid var(--pc);background:#fff;border-radius:99px;font:700 17px Poppins,system-ui;color:var(--pd);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.juz small{font-size:9px;font-weight:500}.juz.on{background:var(--sage);border-color:var(--sage);color:#fff}
input[type=date]{min-width:0;max-width:100%}
.rtr.last{background:#FBF8FF}.tdc{box-shadow:0 0 0 2px var(--pc)}
.ckent{max-height:92vh;overflow:auto}
.txr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;border-bottom:1px solid #F1EAE4;font-family:Poppins,system-ui;color:var(--ink);text-align:left;cursor:pointer}
.txr:last-child{border-bottom:0}.txe{width:40px;height:40px;border-radius:13px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.txm{flex:1;min-width:0}.txm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txm small{font-size:11.5px;color:var(--muted)}
.txa{font-weight:700;font-size:14px;white-space:nowrap}.txa.out,b.out{color:#C0564B}.txa.in,b.in{color:#3B8456}
.ckbal{background:linear-gradient(135deg,var(--sage),var(--pd));color:#fff}.ckbal small{opacity:.85;font-size:12.5px}
.big2{font-size:30px;font-weight:700;letter-spacing:-.5px}
.ckio{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px}.ckio small{display:block;font-size:11px}.ckio b{font-size:15px;color:#fff!important;white-space:nowrap}
.ckmini{flex:1;padding:12px;margin-top:12px;text-align:center}.ckmini small{display:block;font-size:11.5px;color:var(--muted)}.ckmini b{font-size:12.5px;white-space:nowrap}
.amtw{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;background:#fff;margin-top:8px}
.amtw span{font-weight:600;color:var(--muted);font-size:14px}.amtw input{border:0!important;padding:10px 0!important;font:600 16px Poppins,system-ui;width:100%;min-width:0;background:none;outline:none;margin:0!important}

.amtbig{font-size:34px;font-weight:700;text-align:center;margin:14px 0 8px;color:#C0564B}.amtbig.in{color:#3B8456}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kp button{border:0;background:#fff;border-radius:14px;padding:11px 0;font:600 19px Poppins,system-ui;color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.kp button:active{background:var(--pl)}
.kl{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}

.cc span{font-size:22px}.cc small{font-size:9.5px;line-height:1.2;text-align:center}.cc.on{border-color:var(--sage);background:var(--pl)}

function welcome(){

const PLID="planner-2027-id", PLCKEY="littlesnoor.content."+PLID, PLKEY="planner.v1";
let PLT=null, PL=null, plDate=null, plMon=null, plSub="cal", plRam="prep", plTgt="dunia", plCatOpen=null;
function plLoad(){if(PL)return PL;try{PL=JSON.parse(lsGet(PLKEY)||"null");}catch(e){}PL=Object.assign({jur:{},ref:{},visi:{},word:"",tgt:{},mon:{},hab:{},muh:{},ram:{},cat:[],rem:{}},PL||{});return PL;}

let plT;function plFlash(){const e=$("#sv");if(e)e.textContent="Menyimpan...";clearTimeout(plT);plT=setTimeout(()=>{plSave();if($("#sv"))$("#sv").textContent="Tersimpan otomatis ✓";},400);}
const BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const pad2=n=>String(n).padStart(2,"0");
const dkey=(y,m,d)=>y+"-"+pad2(m)+"-"+pad2(d);
const pDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const kOf=d=>dkey(d.getFullYear(),d.getMonth()+1,d.getDate());
function hijri(s){const T=PLT.hstart;let st=null;for(const x of T)if(x[0]<=s)st=x;if(!st)return null;const n=Math.round((pDate(s)-pDate(st[0]))/864e5)+1;if(n>30)return null;return [n,PLT.hm[st[1]],st[2]];}
function hijriTxt(s){const h=hijri(s);return h?`${h[0]} ${h[1]} ${h[2]} H`:"";}
const plEvt=s=>{const e=(PLT.events||[]).find(x=>x[0]===s);return e?e[1]:"";};
function plHead(title,sub,back){return `<div class="brand">${back?`<button class="back" id="plBack">‹ ${back[1]}</button>`:`<button class="back" id="toShelf">‹ Rak</button>`}<span>Planner Muslimah 2027</span></div><div class="hello">${title}</div>${sub?`<div class="sub">${sub}</div>`:""}`;}
function plBind(back){if($("#toShelf"))$("#toShelf").onclick=()=>go("shelf");if(back&&$("#plBack"))$("#plBack").onclick=()=>go(back[0]);
  app.querySelectorAll("[data-pk]").forEach(el=>{if(el.tagName==="TEXTAREA")auto(el);el.oninput=()=>{const [o,k]=plPath(el.dataset.pk);o[k]=el.value;if(el.tagName==="TEXTAREA")auto(el);plFlash();};});
  if($("#plSaveBtn"))$("#plSaveBtn").onclick=()=>{clearTimeout(plT);plSave();toast("Tersimpan ✓");};bindFmt(app);}
function plPath(p){const parts=p.split(".");let o=plLoad();for(let i=0;i<parts.length-1;i++){o[parts[i]]=o[parts[i]]||{};o=o[parts[i]];}return [o,parts[parts.length-1]];}
function plGet(p){const [o,k]=plPath(p);return o[k]||"";}
const plTa=(p,lab,ph="",rows=3)=>`<div class="blk box"><label>${lab}</label>${TB}<textarea data-pk="${p}" rows="${rows}" placeholder="${ph}">${esc(plGet(p))}</textarea></div>`;
const plSaveBtn='<button class="btn" id="plSaveBtn" style="margin-top:16px">💾 Simpan</button><div class="saved" id="sv"></div>';
function plCurMon(){const d=new Date();return d.getFullYear()===PLT.year?d.getMonth()+1:(d.getFullYear()>PLT.year?12:1);}
function nextEvent(){const t=today();const e=(PLT.events||[]).find(x=>x[0]>=t);if(!e)return null;return [e[1],e[0],Math.round((pDate(e[0])-pDate(t))/864e5)];}
function jurFill(k){const j=plLoad().jur[k];if(!j)return 0;let n=0;if(j.mood)n++;if((j.syk||[]).some(Boolean))n++;if((j.pri||[]).some(x=>x&&x.t))n++;if(Object.values(j.ib||{}).some(Boolean))n++;if((j.ref||"").trim())n++;return n;}
function habPct(m){const H=plLoad().hab[m];if(!H||!H.list||!H.list.length)return null;const dim=new Date(PLT.year,m,0).getDate();let c=0;H.list.forEach((_,i)=>{for(let d=1;d<=dim;d++)if((H.done[i]||{})[d])c++;});return Math.round(c/(H.list.length*dim)*100);}
function stepsStat(){const T=plLoad().tgt;let a=0,b=0;Object.values(T).forEach(x=>(x.steps||[]).forEach(s=>{b++;if(s.done)a++;}));return [a,b];}

pljur(){const M=plLoad();plDate=plDate||today();const j=M.jur[plDate]=M.jur[plDate]||{mood:"",syk:["","",""],pri:[],ib:{},ref:""};j.pri=j.pri||[];j.ib=j.ib||{};j.syk=j.syk||["","",""];

  plBind();
  const drawP=()=>{$("#pri").innerHTML=j.pri.map((p,i)=>`<div class="amal ${p.done?"on":""}" data-i="${i}"><div class="check">${p.done?"✓":""}</div><span>${esc(p.t)}</span><button class="mini" data-x="${i}">✕</button></div>`).join("")||`<p class="small" style="margin:0">Maksimal 3–4 saja, biar ringan 🌱</p>`;

  $("#addP").onclick=()=>{const v=$("#np").value.trim();if(!v)return;j.pri.push({t:v,done:false});$("#np").value="";plSave();drawP();};
  $("#np").onkeydown=e=>{if(e.key==="Enter")$("#addP").onclick();};
  app.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{j.mood=j.mood===b.dataset.mood?"":b.dataset.mood;plSave();app.querySelectorAll("[data-mood]").forEach(x=>x.classList.toggle("on",x.dataset.mood===j.mood));});
  app.querySelectorAll("[data-syk]").forEach(el=>el.oninput=()=>{j.syk[+el.dataset.syk]=el.value;plFlash();});
  app.querySelectorAll("[data-ib]").forEach(b=>b.onclick=()=>{const i=b.dataset.ib;j.ib[i]=!j.ib[i];plSave();b.classList.toggle("on",!!j.ib[i]);b.querySelector(".check").textContent=j.ib[i]?"✓":"";});

  const shift=k=>{const d=pDate(plDate);d.setDate(d.getDate()+k);plDate=kOf(d);PLV.pljur();};

plmon(){const M=plLoad(),Y=PLT.year;plMon=plMon||plCurMon();const m=plMon,mk=String(m);
  const subs=[["cal","Kalender"],["hab","Habit Tracker"],["muh","Muhasabah"]];
  const a=hijri(dkey(Y,m,1)),b=hijri(dkey(Y,m,new Date(Y,m,0).getDate()));
  let body="";
  if(plSub==="cal"){const first=(new Date(Y,m-1,1).getDay()+6)%7,dim=new Date(Y,m,0).getDate(),notes=M.mon[mk]=M.mon[mk]||{days:{},f:{}};
    let cells="";for(let i=0;i<first;i++)cells+=`<div class="cd e"></div>`;
    for(let d=1;d<=dim;d++){const k=dkey(Y,m,d),h=hijri(k),ev=plEvt(k),has=(notes.days[d]||"").trim()||jurFill(k);

      ${PLT.fokus.map((f,i)=>plTa(`mon.${mk}.f.${i}`,f,"",2)).join("")}${plSaveBtn}`;}
  else if(plSub==="hab"){const H=M.hab[mk]=M.hab[mk]||{list:[],done:{}};const dim=new Date(Y,m,0).getDate();
    body=`${H.list.length?H.list.map((h,i)=>{const dn=H.done[i]=H.done[i]||{};const c=Object.values(dn).filter(Boolean).length;
      return `<div class="card" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:center"><b style="font-size:14.5px">${esc(h)}</b><span class="small"><b style="color:var(--pd)">${Math.round(c/dim*100)}%</b> <button class="mini" data-hx="${i}">✕</button></span></div>
      <div class="hgrid">${[...Array(dim)].map((_,d)=>`<button class="hd ${dn[d+1]?"on":""} ${dkey(Y,m,d+1)===today()?"td":""}" data-h="${i}" data-d="${d+1}">${d+1}</button>`).join("")}</div></div>`;}).join("")
      :`<div class="card"><p class="small" style="margin:0">Belum ada kebiasaan bulan ini. Pilih dari ide di bawah atau tulis sendiri 🌱</p></div>`}
      <div class="card"><b style="font-size:14px">Tambah kebiasaan</b><div class="row" style="margin-top:8px"><input type="text" id="nh" placeholder="misal: Tilawah 1 halaman"><button class="back" id="addH">＋</button></div>
      <div class="chips" style="flex-wrap:wrap">${PLT.habits.filter(x=>!H.list.includes(x)).map(x=>`<button class="fchip" data-hs="${esc(x)}">＋ ${esc(x)}</button>`).join("")}</div>
      ${m>1&&(M.hab[String(m-1)]||{list:[]}).list.length&&!H.list.length?`<button class="btn light" id="copyH" style="margin-top:10px">Salin kebiasaan dari ${BLN[m-2]}</button>`:""}</div>
      ${plTa(`hab.${mk}.note`,"Catatan kebiasaan bulan ini","",2)}${plSaveBtn}`;}
  else{const R=M.muh[mk]=M.muh[mk]||{};
    body=`<div class="blk box"><label>Bagaimana bulan ini secara keseluruhan?</label><div class="moods">${[1,2,3,4,5].map(n=>`<button class="mood ${R.rate===n?"on":""}" data-rate="${n}" style="font-size:18px;font-weight:700;color:var(--pd)">${n}<small>${["berat","kurang","cukup","baik","sangat baik"][n-1]}</small></button>`).join("")}</div></div>

  app.innerHTML=`<div class="wrap">${plHead(BLN[m-1]+" "+Y,a&&b?(a[2]!==b[2]?`${a[1]} ${a[2]} – ${b[1]} ${b[2]} H`:`${a[1]} – ${b[1]} ${b[2]} H`):"")}
  <div class="chips">${BLN.map((x,i)=>`<button class="fchip ${i+1===m?"on":""}" data-m="${i+1}">${x.slice(0,3)}</button>`).join("")}</div>

  setTimeout(()=>{const on=app.querySelector(".chips .fchip.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});},0);

    app.querySelectorAll("[data-hx]").forEach(x=>x.onclick=()=>confirmBox("Hapus kebiasaan ini?","Centang bulan ini untuk kebiasaan ini juga ikut terhapus.",()=>{const i=+x.dataset.hx;H.list.splice(i,1);const nd={};Object.keys(H.done).forEach(k=>{if(+k<i)nd[k]=H.done[k];else if(+k>i)nd[+k-1]=H.done[k];});H.done=nd;plSave();PLV.plmon();}));}},

function feedbackSheet(){const A=acc()||{};let kind="masukan";

  <div class="chips" style="flex-wrap:wrap">${K.map(([k,l])=>`<button class="fchip ${kind===k?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>

  e.querySelector("#fbx").onclick=()=>e.remove();
  e.querySelector("#fbs").onclick=async()=>{const m=e.querySelector("#fbm").value.trim();if(m.length<3){toast("Tulis sarannya dulu ya");return;}
    const btn=e.querySelector("#fbs");btn.disabled=true;btn.textContent="Mengirim...";
    try{const r=await rpc("send_feedback",{p_email:A.email||"",p_kind:kind,p_msg:m.slice(0,2000),p_ctx:(view||"")+" · "+navigator.userAgent.slice(0,120)});
      if(r&&r.ok===false)throw 0;e.remove();sheet("Terima kasih! 🤍","Saranmu sudah sampai. Doakan kami bisa terus berbenah dan membuat yang lebih bermanfaat ya.");}
    catch(x){btn.disabled=false;btn.textContent="Kirim saran";location.href="mailto:littlesnoor@gmail.com?subject="+encodeURIComponent("Saran littles noor ("+kind+")")+"&body="+encodeURIComponent(m);}};};
  draw();document.body.appendChild(e);e.onclick=x=>{if(x.target===e)e.remove();};}
function shelfGroups(P,SO){
  if(shelfCat!=="all")return [["",P.filter(p=>catOf(p)===shelfCat)]];
  return [["",P]];
  const pins=P.filter(p=>SO.pin.includes(p.id)),rest=P.filter(p=>!SO.pin.includes(p.id));
  const used=PCATS.filter(c=>rest.some(p=>catOf(p)===c[0]));
  if(used.length<=1&&!pins.length)return [["",P]];
  const G=[];if(pins.length)G.push(["📌 Disematkan",pins]);
  used.forEach(c=>G.push([c[1]+" "+c[2],rest.filter(p=>catOf(p)===c[0])]));return G;}
function shelf(){
  const A=acc()||{}, owned=[...(A.owned||[]),"saku"], P0=[...(A.products||[]),SAKU];
  const [sal,gsub]=greet();
  let SO;try{SO=JSON.parse(lsGet("littlesnoor.shelf")||"null");}catch(e){}SO=Object.assign({order:[],pin:[]},SO||{});
  const rank=p=>{const pi=SO.pin.indexOf(p.id),oi=SO.order.indexOf(p.id),di=P0.indexOf(p);return (pi>=0?pi:1000)*100000+(oi>=0?oi:500+di)*10+(owned.includes(p.id)&&p.live?0:1)*0;};
  const P=[...P0].sort((a,b)=>rank(a)-rank(b));
  const saveSO=()=>lsSet("littlesnoor.shelf",JSON.stringify(SO));
  app.innerHTML=`<div class="wrap">
  <div class="brand"><b>littles noor</b><button class="back" id="logoutTop">Keluar ⎋</button></div>
  <div class="hello">${sal}${S.name?", "+esc(S.name):""} ${sal==="Masih terjaga"?"🌙":"🤍"}</div>
  <div class="sub">${gsub?gsub+"<br>":""}Kamu semangat terus ya, jangan menyerah. Biarlah Allah menjadi sebaik-baik saksi atas setiap hal yang kamu usahakan 😊</div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="mini" id="editShelf">${shelfEdit?"✓ Selesai":"⇅ Atur rak"}</button></div>
  ${shelfEdit?`<p class="small" style="margin:6px 0 0">Ketuk 📌 untuk menyematkan di atas, atau geser dengan ‹ ›.</p>`:""}
  ${(()=>{const used=PCATS.filter(c=>P.some(p=>catOf(p)===c[0]));return used.length>1?`<div class="chips">${[["all","✨","Semua"],...used].map(c=>`<button class="fchip ${shelfCat===c[0]?"on":""}" data-cat="${c[0]}">${c[1]} ${c[2]}</button>`).join("")}</div>`:"";})()}
  ${shelfGroups(P,SO).map(([title,L])=>`${title?`<div class="sec"><h3>${title}</h3></div>`:""}<div class="shelf ${shelfEdit?"editing":""}">${L.map(p=>{const ix=P.indexOf(p);const own=owned.includes(p.id), live=p.live, pin=SO.pin.includes(p.id);
     const adm=["littlesnoor@gmail.com"].includes((A.email||"").toLowerCase());
     const tag=p.id==="saku"?"✨ Gratis":!live?(adm&&own?"👀 Pratinjau":"Segera hadir"):(own?"":"Terkunci");
     const wide=false;
     return `<button class="prod ${own&&live?"":"locked"} ${wide?"wide":""}" data-id="${p.id}" style="border-top:5px solid ${p.color}">
     ${tag?`<span class="tag" ${p.id==="saku"?'style="background:#FFE0D2;color:#782D1E"':""}>${tag==="Terkunci"?"🔒 ":""}${tag}</span>`:""}${pin&&!shelfEdit?`<span class="pinb">📌</span>`:""}
     ${shelfEdit?`<span class="sedit"><i data-mv="-1" data-p="${p.id}" ${ix===0?'class="off"':""}>‹</i><i data-pin="${p.id}" class="${pin?"on":""}">📌</i><i data-mv="1" data-p="${p.id}" ${ix===P.length-1?'class="off"':""}>›</i></span>`:""}
     <img src="covers/${p.id}.jpg" alt=""><b>${esc(p.name)}</b><span>${esc(!live?p.tagline:(own?p.tagline:"Dapatkan di lynk.id/littlesnoor"))}</span></button>`}).join("")}</div>`).join("")}
  <button class="card fbcard" id="fbOpen"><span style="font-size:28px">💌</span><span style="flex:1;text-align:left"><b>Kotak saran</b><small>Punya masukan atau ide aplikasi baru? Ceritakan ke kami</small></span><span class="small">›</span></button>
  <div class="card" style="margin-top:18px;display:flex;align-items:center;gap:10px"><p class="small" style="margin:0;flex:1">Masuk sebagai <b>${esc(A.email||"")}</b></p><button class="mini" id="logoutBtn">Keluar</button></div>

  $("#editShelf").onclick=()=>{shelfEdit=!shelfEdit;shelf();};
  $("#logoutTop").onclick=logout;$("#logoutBtn").onclick=logout;$("#fbOpen").onclick=feedbackSheet;
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{shelfCat=b.dataset.cat;shelf();});
  setTimeout(()=>{const on=app.querySelector("[data-cat].on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});},0);
  app.querySelectorAll(".prod").forEach(el=>el.onclick=e=>{
    if(shelfEdit){const t=e.target;
      if(t.dataset.pin){const id=t.dataset.pin;SO.pin=SO.pin.includes(id)?SO.pin.filter(x=>x!==id):[...SO.pin,id];saveSO();shelf();}
      else if(t.dataset.mv&&!t.classList.contains("off")){const ids=P.map(x=>x.id),i=ids.indexOf(t.dataset.p),j=i+(+t.dataset.mv);[ids[i],ids[j]]=[ids[j],ids[i]];
        const pinned=SO.pin.filter(x=>ids.includes(x));SO.pin=ids.filter(x=>pinned.includes(x));SO.order=ids;saveSO();shelf();}
      return;}
    openProduct(el.dataset.id);});
}

async function openProduct(id){

  const A=acc()||{}, p=(A.products||[]).find(x=>x.id===id)||{};
  if(!p.live&&!(A.owned||[]).includes(id)){sheet(p.name||"Segera hadir","Sedang kami siapkan dengan sepenuh hati 🤍 Pantau kabarnya di Instagram <a href='https://instagram.com/littlesnoor' target='_blank' rel='noopener' style='color:var(--sage);font-weight:700'>@littlesnoor</a>.");return;}
  if(!(A.owned||[]).includes(id)){sheet(p.name||"Produk ini","Kamu belum memiliki produk ini. Dapatkan di <a href='https://lynk.id/littlesnoor' target='_blank' rel='noopener' style='color:var(--sage);font-weight:700'>lynk.id/littlesnoor</a>, lalu masuk dengan email yang sama.");return;}
  const ADMIN=["littlesnoor@gmail.com"];
  if(!p.live&&!ADMIN.includes((A.email||"").toLowerCase())){sheet(p.name,"Kamu sudah memiliki produk ini. Versi aplikasinya sedang disiapkan, sementara gunakan PDF-nya dulu ya 🤍");return;}
  if(!p.live)toast("Mode pratinjau (belum dirilis)");
  if(id===ML){
    let c=lsGet(CKEY);
    if(!c){try{const r=await getContent(A.email,ML);if(r&&r.ok&&r.data){c=JSON.stringify(r.data);lsSet(CKEY,c);}}catch(e){}}
    if(!c){toast("Butuh internet untuk membuka pertama kali");return;}
    DAYS=JSON.parse(c); go("home");
  }
  if(id===MJID){
    let c=lsGet(MJCKEY);
    if(!c){try{const r=await getContent(A.email,MJID);if(r&&r.ok&&r.data){c=JSON.stringify(r.data);lsSet(MJCKEY,c);}}catch(e){}}
    if(!c){toast("Butuh internet untuk membuka pertama kali");return;}
    MJT=JSON.parse(c); go("mjhome");
  }
  if(id===PLID){
    let c=lsGet(PLCKEY);
    if(!c){try{const r=await getContent(A.email,PLID);if(r&&r.ok&&r.data){c=JSON.stringify(r.data);lsSet(PLCKEY,c);}}catch(e){}}
    if(!c){toast("Butuh internet untuk membuka pertama kali");return;}
    PLT=JSON.parse(c); go("plhome");
  }
  if(id===CUID){cuMon=null;go("cuhome");return;}
  if(id===CKID){
    let c=lsGet(CKCKEY);
    if(!c){try{const r=await getContent(A.email,CKID);if(r&&r.ok&&r.data){c=JSON.stringify(r.data);lsSet(CKCKEY,c);}}catch(e){}}
    if(!c){toast("Butuh internet untuk membuka pertama kali");return;}
    CKT=JSON.parse(c); ckMon=null; go("ckhome");
  }
}
function sheet(t,m){const e=document.createElement("div");e.className="modal";e.innerHTML=`<div class="sheet"><h3>${esc(t)}</h3><p class="small" style="font-size:14px">${m}</p><button class="btn" id="ok" style="margin-top:12px">Oke</button></div>`;
 document.body.appendChild(e);e.querySelector("#ok").onclick=()=>e.remove();e.onclick=x=>{if(x.target===e)e.remove();};}
function lockScreen(msg){
  theme("hub");
  $("#nav").classList.add("hidden");
  app.innerHTML=`<div class="wrap welcome"><div class="arch"></div>
  <div class="big">littles noor</div><p class="sub" style="font-size:15px">Masuk dengan email yang kamu pakai<br>saat membeli di Lynk.id</p>
  <div class="card" style="text-align:left"><label style="font-weight:600;font-size:14px">Email pembelian</label>
  <input type="text" id="em" inputmode="email" autocomplete="email" placeholder="nama@email.com" style="margin-top:8px" value="${esc((acc()||{}).email||"")}">
  <p class="small" id="err" style="color:#B4566A;margin:10px 0 0;min-height:18px">${msg||""}</p></div>
  <button class="btn" id="unlock" style="margin-top:16px">Masuk</button>
  <a href="saku/" style="display:block;margin-top:12px;background:#FFE0D2;color:#782D1E;border-radius:16px;padding:13px;font-weight:600;text-decoration:none;text-align:center">🌙 Coba Saku gratis: kartu sakti littles noor</a>
  <p class="small" style="margin-top:14px">Belum punya? Dapatkan di <a href="https://lynk.id/littlesnoor" target="_blank" rel="noopener" style="color:var(--sage);font-weight:700">lynk.id/littlesnoor</a><br>Butuh bantuan? DM Instagram <a href="https://instagram.com/littlesnoor" target="_blank" rel="noopener" style="color:var(--sage);font-weight:700">@littlesnoor</a></p></div>`;
  $("#unlock").onclick=async()=>{
    const em=$("#em").value.trim().toLowerCase(), btn=$("#unlock"), err=$("#err");
    if(!/^\S+@\S+\.\S+$/.test(em)){err.textContent="Tulis email yang lengkap ya.";return;}
    btn.disabled=true;btn.textContent="Memeriksa...";err.textContent="";
    try{const res=await login(em);
      if(res&&res.ok){lsSet(AKEY,JSON.stringify({email:em,owned:res.owned||[],products:res.products||[],at:Date.now()}));start();return;}
      err.innerHTML=res&&res.reason==="device_limit"?"Email ini sudah dipakai di batas maksimal perangkat. Hubungi <a href='https://instagram.com/littlesnoor' target='_blank' rel='noopener' style='color:var(--sage);font-weight:700'>@littlesnoor</a> untuk reset.":"Email ini belum terdaftar sebagai pembeli. Pastikan sama dengan email saat membeli, atau hubungi <a href='https://instagram.com/littlesnoor' target='_blank' rel='noopener' style='color:var(--sage);font-weight:700'>@littlesnoor</a>.";
    }catch(e){err.textContent="Tidak bisa terhubung. Cek internetmu lalu coba lagi.";}
    btn.disabled=false;btn.textContent="Masuk";};
}
function deep(){return location.hostname.startsWith("mulailagi.")||location.hash==="#mulai-lagi";}
function start(){
  const A=acc();
  go("shelf");
}
async function boot(){
  const A=acc();
  if(!A){lockScreen();return;}
  start();
  if(navigator.onLine!==false){try{const res=await login(A.email);
    if(res&&res.ok){lsSet(AKEY,JSON.stringify(Object.assign(A,{owned:res.owned||[],products:res.products||[],at:Date.now()})));if(view==="shelf")shelf();
      if((res.owned||[]).includes(ML)){try{const r=await getContent(A.email,ML);if(r&&r.ok&&r.data){lsSet(CKEY,JSON.stringify(r.data));}}catch(e){}}
      if((res.owned||[]).includes(MJID)){try{const r=await getContent(A.email,MJID);if(r&&r.ok&&r.data){lsSet(MJCKEY,JSON.stringify(r.data));}}catch(e){}}
      if((res.owned||[]).includes(PLID)){try{const r=await getContent(A.email,PLID);if(r&&r.ok&&r.data){lsSet(PLCKEY,JSON.stringify(r.data));}}catch(e){}}
      if((res.owned||[]).includes(CKID)){try{const r=await getContent(A.email,CKID);if(r&&r.ok&&r.data){lsSet(CKCKEY,JSON.stringify(r.data));}}catch(e){}}}
    else if(res&&!res.ok){lsDel(AKEY);lsDel(CKEY);lockScreen(res.reason==="device_limit"?"Perangkat ini sudah tidak terdaftar. Hubungi <a href='https://instagram.com/littlesnoor' target='_blank' rel='noopener' style='color:var(--sage);font-weight:700'>@littlesnoor</a>.":"Akses untuk email ini sudah tidak aktif.");}}catch(e){}}
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
view="shelf";boot();
</script>
